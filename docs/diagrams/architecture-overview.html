<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CJ 회의실 예약 에이전트 · 아키텍처</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 640px;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CJ 회의실 예약 자동화</p>
    <h1>텔레그램 에이전트 전체 흐름</h1>
    <p class="subtitle">등록(Vercel) → 승인(Admin) → 예약(사내망 서버·CJ 연동)까지, Supabase를 중심으로 연결되는 구조.</p>

    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cjroom-architecture-title cjroom-architecture-desc">
      <title id="cjroom-architecture-title">CJ 회의실 예약 에이전트 아키텍처</title>
      <desc id="cjroom-architecture-desc">등록 웹페이지와 Admin 패널(Vercel)이 Supabase DB에 사용자 정보를 저장하고, 사내망에서 24시간 구동되는 서버가 텔레그램 봇·LLM·CJ 자동화를 모두 담당하여 CJ 사내 시스템에 예약을 실행하는 구조를 보여주는 아키텍처 다이어그램.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.5"/>

      <!-- Zone: Vercel (Public UI) -->
      <rect x="444" y="128" width="412" height="112" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="600" y="132" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="141" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">VERCEL · PUBLIC UI</text>

      <!-- ============ ARROWS (drawn before nodes) ============ -->

      <!-- A1 사용자 -> 등록 웹페이지 -->
      <path d="M320,336 H382 Q390,336 390,328 V200 Q390,192 398,192 H460"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="402" y="258" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="434" y="267" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">계정 등록</text>

      <!-- A2 사용자 -> 사내망 서버 (primary) -->
      <path d="M320,368 H382 Q390,368 390,376 V504 Q390,512 398,512 H460"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="402" y="430" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="430" y="439" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">예약 요청</text>

      <!-- A3 관리자 -> Admin 패널 -->
      <line x1="760" y1="104" x2="760" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="774" y="125" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="804" y="134" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">승인 로그인</text>

      <!-- A4 등록 웹페이지 -> Supabase DB -->
      <line x1="540" y1="224" x2="540" y2="320" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="552" y="265" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="590" y="274" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">등록요청 저장</text>

      <!-- A5 Admin 패널 -> Supabase DB -->
      <path d="M760,224 V264 Q760,272 752,272 H608 Q600,272 600,280 V320"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="650" y="252" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="678" y="261" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">승인 반영</text>

      <!-- A6 Supabase DB -> 사내망 서버 -->
      <path d="M540,384 V424 Q540,432 548,432 H562 Q570,432 570,440 V480"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="548" y="412" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="572" y="421" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">조회·저장</text>

      <!-- A7 사내망 서버 -> CJ 사내 시스템 (primary) -->
      <line x1="680" y1="512" x2="760" y2="512" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="692" y="490" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="726" y="499" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">로그인·예약API</text>

      <!-- A8 사내망 서버 -> 사용자 (dashed return) -->
      <path d="M460,496 H380 Q372,496 372,488 V360 Q372,352 364,352 H320"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="380" y="418" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="427" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">결과 안내</text>

      <!-- ============ NODES ============ -->

      <!-- N1 관리자 (Admin, external actor) -->
      <rect x="680" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="688" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="702" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADM</text>
      <text x="760" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">관리자</text>
      <text x="760" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">승인 담당자</text>

      <!-- N2 등록 웹페이지 -->
      <rect x="460" y="160" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="160" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="468" y="168" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="482" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="540" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">등록 웹페이지</text>
      <text x="540" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Vercel</text>

      <!-- N3 Admin 패널 -->
      <rect x="680" y="160" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="160" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="168" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="702" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PNL</text>
      <text x="760" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admin 패널</text>
      <text x="760" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Vercel · 인증 필요</text>

      <!-- N4 사용자 -->
      <rect x="180" y="320" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="320" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="188" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="202" y="337" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="250" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">사용자</text>
      <text x="250" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">임직원 · 텔레그램</text>

      <!-- N5 Supabase DB (focal store) -->
      <rect x="460" y="320" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="320" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="468" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="482" y="337" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="540" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase DB</text>
      <text x="540" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">중앙 데이터 저장소</text>

      <!-- N6 사내망 서버 (focal backend) -->
      <rect x="460" y="480" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="480" width="220" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="468" y="488" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="482" y="497" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVR</text>
      <text x="570" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">사내망 서버 (24H 상시)</text>
      <text x="570" y="532" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">텔레그램봇 · LLM · CJ자동화</text>

      <!-- N7 CJ 사내 시스템 (external) -->
      <rect x="760" y="480" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="480" width="180" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="768" y="488" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="782" y="497" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYS</text>
      <text x="850" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CJ 사내 시스템</text>
      <text x="850" y="532" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cj.cj.net / cjwappr.cj.net</text>

      <!-- Legend strip -->
      <line x1="40" y1="584" x2="960" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="616" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">핵심 저장소/서버</text>

      <rect x="196" y="616" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="216" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Vercel 화면</text>

      <rect x="336" y="616" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="356" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">사람 (사용자/관리자)</text>

      <rect x="512" y="616" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="532" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">외부 시스템 (CJ)</text>

      <line x1="672" y1="620" x2="700" y2="620" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="708" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">DB API 호출</text>

      <line x1="820" y1="620" x2="848" y2="620" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="856" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">핵심 예약 흐름</text>

      <line x1="40" y1="648" x2="68" y2="648" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="76" y="652" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">응답 / 비동기</text>
    </svg>
  </div>
</body>
</html>
